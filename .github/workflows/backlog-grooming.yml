name: Scraut — Backlog Grooming
on:
  schedule:
    - cron: '0 2 * * 3'  # Wednesday 9am Jakarta = 02:00 UTC (mid-sprint)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip all writes and API calls (safe for local act testing)'
        required: false
        default: 'false'
        type: boolean

jobs:
  grooming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - run: pip install -r apps/automation/requirements.txt

      - name: Set up Ollama (if configured)
        uses: ./.github/actions/setup-ollama

      - name: Prioritise unlabelled backlog items
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DRY_RUN_FLAG: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          python apps/automation/scraut/scrum/backlog/prioritize_backlog.py \
            --repo ${{ github.repository }} $DRY_RUN_FLAG

      - name: Check for scope creep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DRY_RUN_FLAG: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          python apps/automation/scraut/scrum/sprint/check_scope_creep.py \
            --repo ${{ github.repository }} $DRY_RUN_FLAG
