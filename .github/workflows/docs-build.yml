name: Scraut — Build Documentation

on:
  push:
    branches: [main]
    paths:
      - 'apps/docusaurus/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/docusaurus/package-lock.json

      - name: Install dependencies
        working-directory: apps/docusaurus
        run: npm ci

      - name: Build documentation
        working-directory: apps/docusaurus
        run: npm run build

      - name: Add .nojekyll
        run: touch docs/.nojekyll

      - name: Commit built docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "docs: rebuild documentation site [skip ci]"
          git push
