name: Scraut — Publish Portal (GitHub Pages)

# Deploys apps/portal/ (the team sprint dashboard) to GitHub Pages.
#
# This workflow is for TEAM REPOS — clones of aldhosutra/scraut where the
# team uses Scraut for their sprints. Their GitHub Pages URL becomes the
# sprint dashboard.
#
# The aldhosutra/scraut TEMPLATE REPO uses a different Pages setup:
# branch-based deployment from /docs (Docusaurus documentation site).
# The template repo skips this workflow via the SKIP_PORTAL_DEPLOY secret.
#
# To disable portal deploy in your repo: add repository secret
# SKIP_PORTAL_DEPLOY=true

on:
  push:
    branches: [main]
    paths:
      - 'apps/portal/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ vars.SKIP_PORTAL_DEPLOY != 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload portal artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/portal/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
