name: Scraut — Sprint Planning
on:
  workflow_dispatch:
    inputs:
      sprint_num:
        description: 'Sprint number to plan'
        required: true
      repo:
        description: 'org/repo'
        required: true
      dry_run:
        description: 'Skip all writes and API calls (safe for local act testing)'
        required: false
        default: 'false'
        type: boolean

jobs:
  create-planning-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - run: pip install -r apps/automation/requirements.txt

      - name: Set up Ollama (if configured)
        uses: ./.github/actions/setup-ollama

      - name: Create sprint and planning PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DRY_RUN_FLAG: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          python apps/automation/scraut/scrum/sprint/create_sprint.py \
            --sprint ${{ github.event.inputs.sprint_num }} \
            --repo ${{ github.event.inputs.repo }} \
            $DRY_RUN_FLAG
          python apps/automation/scraut/scrum/sprint/create_planning_pr.py \
            --sprint ${{ github.event.inputs.sprint_num }} \
            --repo ${{ github.event.inputs.repo }} \
            $DRY_RUN_FLAG
