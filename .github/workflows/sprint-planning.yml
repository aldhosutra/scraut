name: Scraut — Sprint Planning
on:
  workflow_dispatch:
    inputs:
      sprint_num:
        description: 'Sprint number to plan'
        required: true
      repo:
        description: 'org/repo'
        required: true

jobs:
  create-planning-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - run: pip install -r apps/automation/requirements.txt

      - name: Create sprint and planning PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          python apps/automation/scraut/scrum/sprint/create_sprint.py \
            --sprint ${{ github.event.inputs.sprint_num }} \
            --repo ${{ github.event.inputs.repo }}
          python apps/automation/scraut/scrum/sprint/create_planning_pr.py \
            --sprint ${{ github.event.inputs.sprint_num }} \
            --repo ${{ github.event.inputs.repo }}
