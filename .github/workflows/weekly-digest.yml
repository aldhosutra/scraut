name: Scraut — Weekly Digest

on:
  schedule:
    - cron: '0 1 * * 1'  # Monday 8:00 AM Jakarta (UTC+7) = 01:00 UTC
  workflow_dispatch:

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - run: pip install -r apps/automation/requirements.txt

      - name: Set up Ollama (if configured)
        uses: ./.github/actions/setup-ollama

      - name: Generate and send weekly stakeholder digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python apps/automation/scraut/platform/notifications/weekly_digest.py
