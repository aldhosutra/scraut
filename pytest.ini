[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -v
    --cov=scripts/utils
    --cov=scripts/sprint/calculate_velocity.py
    --cov=scripts/standup/reset_templates.py
    --cov=scripts/milestone/planning_session.py
    --cov=scripts/milestone/health_check.py
    --cov=scripts/visibility/derive_state.py
    --cov=scripts/suggestions/detectors.py
    --cov=scripts/backlog/tally_estimation.py
    --cov=scripts/backlog/triage_issue.py
    --cov=scripts/repo_sync/prefill_standups.py
    --cov-report=term-missing
markers =
    unit: Unit tests (no external I/O)
    integration: Integration tests (uses temp files)
    slow: Tests that take >2 seconds
