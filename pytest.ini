[pytest]
testpaths = test
pythonpath = apps/automation
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -v
    --cov=scraut.platform.utils
    --cov=scraut.scrum.sprint.calculate_velocity
    --cov=scraut.scrum.standup.reset_templates
    --cov=scraut.scrum.milestone.planning_session
    --cov=scraut.scrum.milestone.health_check
    --cov=scraut.scrum.visibility.derive_state
    --cov=scraut.scrum.suggestions.detectors
    --cov=scraut.scrum.backlog.tally_estimation
    --cov=scraut.scrum.backlog.triage_issue
    --cov=scraut.scrum.repo_sync.prefill_standups
    --cov-report=term-missing
markers =
    unit: Unit tests (no external I/O)
    integration: Integration tests (uses temp files)
    slow: Tests that take >2 seconds
