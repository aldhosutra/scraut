# scraut.yml — Scraut Global Configuration
# All fields documented. Minimal required: sprint, team.members, llm.provider

sprint:
  length_days: 14                   # Sprint duration in calendar days
  start_day: monday                 # Day of week sprints start
  start_time: "09:00"               # Local time for ceremony triggers
  timezone: "Asia/Jakarta"          # IANA timezone (affects cron schedules)
  capacity_buffer: 0.85             # Plan to 85% of historical velocity (safety)
  current_sprint: 1                 # Auto-incremented by close_sprint.py
  folder_padding: 3                 # Zero-padding width for sprint folder names (e.g. 3 → sprint/001/)
  work_days:                        # Days your team works. Omit or leave empty for Mon–Fri default.
    - monday                        # Sun–Thu example: [sunday, monday, tuesday, wednesday, thursday]
    - tuesday
    - wednesday
    - thursday
    - friday

team:
  members:
    - login: your-github-login      # GitHub username (exact match)
      display: Your Name            # Human-readable name
      role: developer               # developer | product_owner | scrum_master
      slack_id: UXXXXXXXXX          # Slack member ID (for DMs)
      email: you@example.com        # For email digest
  product_owner: your-github-login  # Login of PO (gets backlog approval step)
  scrum_master: your-github-login   # Login of SM (gets suggestion system alerts)
  slack_channel: "#scraut-bot"      # Main channel for ceremony posts

ceremonies:
  planning: true
  standup: true
  grooming: true
  review: true
  retrospective: true
  estimation: true                  # Emoji reaction-based story point voting

definition_of_done:
  - Tests written for new functionality
  - PR reviewed by at least one team member
  - Acceptance criteria mentioned in PR description
  - No open review comments
  - CI passing

repos:                              # Connected GitHub repos for code activity sync
  - name: placeholder-repo          # Display name
    url: your-org/your-repo         # org/repo format
    branch_filter: [main]           # Only watch these branches
    enabled: false

llm:
  provider: github                  # anthropic | openai | gemini | ollama | github
                                    #   github: uses GITHUB_TOKEN — auto-provided by Actions, zero extra setup
  model: gpt-4o-mini                # Model name (provider-specific)
  small_model: ""                   # Optional: cheaper/faster model for simple tasks
                                    #   github example:    gpt-4o-mini  (same as model — already small)
                                    #   anthropic example: claude-haiku-4-5-20251001
                                    #   gemini example:    gemma-4-31b-it
                                    #   Leave empty to use the primary model for everything.
  base_url: ""                      # Optional: override API base URL
                                    #   openai: Groq / DeepSeek / LM Studio / any OpenAI-compat
                                    #   ollama: http://localhost:11434 or http://host.docker.internal:11434
                                    #   (leave empty to use the provider's default endpoint)
  max_tokens: 1000                  # Per-call token limit
  cost_controls:
    max_daily_tokens: 100000        # Fail-safe daily limit
    batch_where_possible: true      # Batch multiple issues in one call

  # Fallback provider — used automatically when the primary provider fails
  # (e.g. API key not set, quota exceeded, network error).
  #
  # Upgrade options (uncomment one to get better quality or higher limits):
  #
  # Option A: Gemini — free tier, 15k RPD, unlimited TPD, 31B model quality
  # fallback:
  #   provider: gemini
  #   model: gemma-4-31b-it         # free, 1.5k RPD, unlimited TPD
  #
  # Option B: Anthropic — best reasoning, paid
  # fallback:
  #   provider: anthropic
  #   model: claude-sonnet-4-6
  #
  # Option C: Ollama — fully offline, self-hosted runners or local act tests
  # fallback:
  #   provider: ollama
  #   model: qwen2.5:0.5b           # 394 MB, sub-1B, best quality/size ratio

agents:
  enabled: false                    # Set to true to activate agent mode

  roles:
    - id: agent-orchestrator
      type: orchestrator
      enabled: false
      description: "Plans sprints, assigns tasks to specialist agents"

    - id: agent-backend
      type: specialist
      specialty: backend
      enabled: false
      github_workflow: .github/workflows/agent-backend.yml
      description: "Implements backend/API tasks"

    - id: agent-frontend
      type: specialist
      specialty: frontend
      enabled: false
      github_workflow: .github/workflows/agent-frontend.yml
      description: "Implements UI/frontend tasks"

    - id: agent-test
      type: specialist
      specialty: testing
      enabled: false
      github_workflow: .github/workflows/agent-test.yml
      description: "Reviews PRs, writes tests, validates DoD"

    - id: agent-review
      type: specialist
      specialty: review
      enabled: false
      github_workflow: .github/workflows/agent-review.yml
      description: "Reviews PRs, leaves structured feedback"

  human_checkpoints:
    - event: sprint_boundary        # Pause before every new sprint (requires human approval to start)
    - event: milestone_eta_slip     # Pause if ETA drifts > 1 sprint from target
    - event: escalation_count       # Pause if ≥2 agents are simultaneously blocked
    - event: agent_failure          # Pause if any agent workflow fails repeatedly (>3 times/day)

  autonomy_level: supervised        # supervised | semi-auto | full-auto
  # supervised: human approves sprint plan before agents execute
  # semi-auto: agents run freely, checkpoint at sprint boundaries
  # full-auto: agents run continuously, humans receive reports only

paths:
  workspace: workspace              # Human/team-editable source-of-truth files
  scraut: .scraut                   # Generated Scraut artifacts and internal state
  portal: apps/portal               # Deployable stakeholder portal app/output

notifications:
  slack_webhook: ""                 # Set via SLACK_WEBHOOK secret
  morning_dm: true                  # Daily standup link DM at 7:55am
  weekly_email: false               # Weekly email digest
  stakeholder_emails: []            # Email list for weekly digest

portal:
  enabled: true
  title: "Team Dashboard"
  public: true                      # false = private GitHub Pages
  refresh_minutes: 30               # How often board syncs from artifacts
  sync_board: true                  # Sync GitHub Projects board (requires project_number)
  project_number:                   # GitHub Projects board number (from URL: .../projects/N)
                                    # Leave blank to skip board sync; portal HTML always generates

suggestions:
  enabled: true
  min_evidence_count: 3             # Min pattern occurrences before suggesting
  measurement_sprints: 2            # Sprints after implementation to measure

holidays:
  country_code: ""                  # ISO 3166-1 alpha-2 (e.g. US, ID, GB, AU)
                                    # Leave blank to skip the Nager.Date API lookup
  extra_dates: []                   # Company/team holidays not in the API (YYYY-MM-DD)
                                    # - "2026-12-26"
                                    # - "2026-08-17"
  skip_dates: []                    # API-provided dates your team works anyway (YYYY-MM-DD)

standup_coach:
  enabled: false                    # Set to true to activate daily standup coaching
  min_today_words: 20               # Flag Today sections shorter than this word count
  require_issue_ref: true           # Also flag if no #NN issue reference in Today section
  skip_sprint_start_days: 1         # Skip coaching for the first N working days of each sprint
  notify_sm: false                  # DM the Scrum Master a daily summary of who was coached
